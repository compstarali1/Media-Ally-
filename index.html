<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070a14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Ally Player</title>
<style>
:root{
  --bg:#070a14; --ink:#eef2ff; --muted:#9aa4c7;
  --glass:rgba(255,255,255,.07); --glass-border:rgba(255,255,255,.14);
  --depth:#0b0f22;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}

/* Animated backdrop */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
.bg i{position:absolute;border-radius:50%;filter:blur(80px);opacity:.5;animation:float 18s ease-in-out infinite alternate}
.bg i:nth-child(1){width:420px;height:420px;background:#7c5cff;top:-120px;left:-80px}
.bg i:nth-child(2){width:380px;height:380px;background:#22d3ee;bottom:-120px;right:-60px;animation-delay:-6s}
.bg i:nth-child(3){width:300px;height:300px;background:#ec4899;top:40%;left:55%;animation-delay:-11s}
@keyframes float{to{transform:translate(60px,40px) scale(1.15)}}

/* Frosted glass panels */
.glass{background:var(--glass);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);border:1px solid var(--glass-border);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 20px 40px rgba(0,0,0,.35);border-radius:20px}

/* Layout */
.app{height:100%;display:grid;grid-template-rows:auto auto auto 1fr;gap:12px;padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:10px;padding:12px 14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:1.25rem;letter-spacing:.3px;background:linear-gradient(90deg,#c4b5fd,#67e8f9);-webkit-background-clip:text;background-clip:text;color:transparent;margin-right:auto}
.status{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-size:.85rem;color:var(--muted)}
.status b{color:var(--ink);font-weight:600}
.tabs{display:flex;gap:6px;padding:6px;flex-wrap:wrap}
.tabs button{all:unset;cursor:pointer;padding:8px 14px;border-radius:12px;color:var(--muted);font-size:.9rem;transition:.2s}
.tabs button.on{background:rgba(255,255,255,.14);color:var(--ink)}
.tabs small{opacity:.6;margin-left:4px}

/* 3D animated buttons */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;cursor:pointer;color:#fff;font:600 .88rem system-ui,sans-serif;padding:11px 16px;border-radius:14px;background:linear-gradient(180deg,#8b6cff,#6344e8);box-shadow:0 6px 0 var(--depth),0 12px 22px rgba(0,0,0,.4);transform:translateY(0);transition:transform .12s,box-shadow .12s,filter .2s;user-select:none;white-space:nowrap}
.btn:hover{filter:brightness(1.12);transform:translateY(-2px)}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--depth),0 4px 10px rgba(0,0,0,.4)}
.btn.alt{background:linear-gradient(180deg,#2e3857,#1b2238)}
.btn.cyan{background:linear-gradient(180deg,#36e0f5,#0ea5c6)}
.btn.round{width:54px;height:54px;padding:0;border-radius:50%;font-size:1.1rem}
.btn.sm{padding:9px 12px}
.file-label{cursor:pointer}
.file-label input{display:none}

/* Library grid */
.library{overflow:hidden;display:flex;flex-direction:column;min-height:0}
.grid{overflow-y:auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;align-content:start}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 20px;font-size:.95rem;line-height:1.5}
.empty b{display:block;font-size:2.4rem;margin-bottom:10px}
.card{all:unset;cursor:pointer;display:flex;flex-direction:column;border-radius:18px;overflow:hidden;background:rgba(255,255,255,.05);border:1px solid var(--glass-border);box-shadow:0 8px 0 var(--depth),0 14px 24px rgba(0,0,0,.4);transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 0 var(--depth),0 22px 30px rgba(0,0,0,.5)}
.card:active{transform:translateY(4px);box-shadow:0 2px 0 var(--depth)}
.thumb{position:relative;aspect-ratio:16/10;background:linear-gradient(135deg,#1c2340,#0c1020);display:grid;place-items:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .ph{font-size:2rem;opacity:.7}
.badge{position:absolute;top:8px;left:8px;font-size:.66rem;font-weight:700;letter-spacing:.5px;padding:4px 8px;border-radius:999px;background:rgba(0,0,0,.45);backdrop-filter:blur(8px);color:#fff}
.dur{position:absolute;bottom:8px;right:8px;font-size:.72rem;padding:3px 7px;border-radius:8px;background:rgba(0,0,0,.6);color:#fff}
.play-ov{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transition:.2s;background:rgba(0,0,0,.2)}
.card:hover .play-ov{opacity:1}
.play-ov span{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.2);backdrop-filter:blur(10px);font-size:1rem}
.meta{padding:10px 12px;display:flex;flex-direction:column;gap:2px;text-align:left}
.meta span{font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta small{font-size:.72rem;color:var(--muted)}

/* Viewer overlay */
.viewer{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;gap:10px;background:rgba(7,10,20,.75);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom))}
.viewer.open{display:flex;animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}
.vtop{display:flex;align-items:center;gap:10px;padding:10px 12px}
.vtop .name{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:600}
.stage{flex:1;width:100%;min-height:0;min-width:0;position:relative;border-radius:22px;overflow:hidden;background:#000;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.stage video,.stage img{position:absolute;inset:0;width:100%;height:100%;max-width:none;max-height:none;transition:transform .35s ease;background:#000;object-fit:contain}
.stage img{display:none}
.vbar{padding:12px;display:flex;flex-direction:column;gap:10px}
.viewer.expanded .vtop,.viewer.expanded .vbar{display:none}
.viewer .vtop,.viewer .vbar{transition:opacity .4s ease,transform .4s ease}
.viewer.idle{cursor:none}
.viewer.idle .vtop,.viewer.idle .vbar{opacity:0;pointer-events:none}
.viewer.idle .vtop{transform:translateY(-12px)}
.viewer.idle .vbar{transform:translateY(12px)}
.seek{display:flex;align-items:center;gap:10px;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:6px;border-radius:6px;background:rgba(255,255,255,.18);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:linear-gradient(180deg,#fff,#a5f3fc);box-shadow:0 3px 0 var(--depth),0 0 12px rgba(34,211,238,.6);cursor:pointer}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border:0;border-radius:50%;background:#a5f3fc}
.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.hint{text-align:center;font-size:.72rem;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;transition:.3s;z-index:99;padding:10px 16px;border-radius:14px;font-size:.85rem;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}

@media (max-width:600px){
  .brand{width:100%}
  .grid{grid-template-columns:repeat(2,1fr);gap:10px;padding:10px}
  .btn.round{width:48px;height:48px}
}

/* Transparent 3D image buttons */
.ibtn{background:none;border:0;padding:0;cursor:pointer;width:56px;height:56px;display:inline-grid;place-items:center;-webkit-tap-highlight-color:transparent;flex:0 0 auto}
.ibtn.sm{width:44px;height:44px}
.ibtn.big{width:76px;height:76px}
.ibtn img{width:100%;height:100%;object-fit:contain;pointer-events:none;filter:drop-shadow(0 8px 10px rgba(0,0,0,.45));transition:transform .15s ease,filter .2s ease}
.ibtn:hover img{transform:translateY(-3px) scale(1.07);filter:drop-shadow(0 12px 16px rgba(34,211,238,.45))}
.ibtn:active img{transform:translateY(3px) scale(.93);filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
</style>
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div>

<div class="app">
  <header class="glass">
    <div class="brand">Ally Player</div>
    <label class="btn alt file-label">🗂 Open folder<input id="pickFolder" type="file" multiple webkitdirectory></label>
    <label class="btn file-label">📁 Add files<input id="pickFiles" type="file" multiple accept="image/*,video/*"></label>
  </header>

  <div class="status glass">
    <span><b id="statusText">No folder opened</b></span>
    <span id="countText">0 items</span>
  </div>

  <div class="tabs glass">
    <button data-f="all" class="on">All <small id="cAll">0</small></button>
    <button data-f="image">Images <small id="cImg">0</small></button>
    <button data-f="video">Videos <small id="cVid">0</small></button>
  </div>

  <section class="library glass">
    <div class="grid" id="grid"></div>
  </section>
</div>

<!-- Player overlay -->
<div class="viewer" id="viewer">
  <div class="vtop glass">
    <button class="btn sm alt" id="close" title="Close">✕</button>
    <div class="name" id="vname"></div>
    <button class="ibtn sm" id="vfs" title="Fullscreen"><img src="images/transparent/btn-fullscreen-violet.png" alt="Fullscreen"></button>
  </div>

  <div class="stage" id="stage">
    <video id="video" playsinline preload="metadata"></video>
    <img id="img" alt="">
  </div>

  <div class="vbar glass">
    <div class="seek">
      <span id="cur">0:00</span>
      <input type="range" id="seek" min="0" max="100" step="0.1" value="0">
      <span id="dur">0:00</span>
    </div>
    <div class="controls">
      <button class="ibtn sm" id="prev" title="Previous"><img src="images/transparent/btn-prev-violet.png" alt="Previous"></button>
      <button class="ibtn " id="back10" title="Back 10s"><img src="images/transparent/btn-back10-violet.png" alt="−10"></button>
      <button class="ibtn big" id="play" title="Play / Pause"><img id="playImg" src="images/transparent/btn-play-cyan.png" alt="Play"></button>
      <button class="ibtn " id="fwd10" title="Forward 10s"><img src="images/transparent/btn-fwd10-violet.png" alt="+10"></button>
      <button class="ibtn sm" id="next" title="Next"><img src="images/transparent/btn-next-violet.png" alt="Next"></button>
      <button class="btn alt sm" id="speed">1×</button>
      <button class="ibtn sm" id="rotL" title="Rotate left"><img src="images/transparent/btn-rotate-violet.png" alt="Rotate left" style="transform:scaleX(-1)"></button>
      <button class="ibtn sm" id="rotR" title="Rotate right"><img src="images/transparent/btn-rotate-violet.png" alt="Rotate right"></button>
      <button class="btn alt" id="rotate">Rotate</button>
      <button class="btn alt" id="fit">Fit 16:9</button>
      <button class="ibtn sm" id="fsBtn" title="Fullscreen"><img src="images/transparent/btn-fullscreen-violet.png" alt="Fullscreen"></button>
    </div>
    <div class="hint">Space play · ← → navigate · M mute · E expand · F fullscreen · R rotate · S stretch</div>
  </div>
</div>

<div class="toast glass" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const video = $('#video'), img = $('#img'), stage = $('#stage'), viewer = $('#viewer');
const SPEEDS = [1, 1.5, 2, 0.5];
let items = [];          // {name, type:'image'|'video', url, thumb, duration}
let filter = 'all';
let visibleIdx = [];
let current = -1;
let rotation = 0, fitMode = 'contain';
let speedIdx = 0;

/* ---------- helpers ---------- */
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmt(t){
  if (!isFinite(t)) return '0:00';
  t = Math.floor(t); const h = Math.floor(t/3600), m = Math.floor(t%3600/60), s = t%60;
  const ss = String(s).padStart(2,'0');
  return h ? `${h}:${String(m).padStart(2,'0')}:${ss}` : `${m}:${ss}`;
}
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 1800);
}

function setPlayIcon(playing){
  $('#playImg').src = playing ? 'images/transparent/btn-pause-cyan.png' : 'images/transparent/btn-play-cyan.png';
}

/* ---------- loading files ---------- */
function addFiles(list){
  let added = 0;
  for (const f of list){
    const isV = f.type.startsWith('video/') || /\.(mp4|webm|mov|mkv|m4v|ogv|3gp)$/i.test(f.name);
    const isI = f.type.startsWith('image/') || /\.(jpe?g|png|gif|webp|bmp|avif|heic)$/i.test(f.name);
    if (!isV && !isI) continue;
    const item = {name: f.name, type: isV ? 'video' : 'image', url: URL.createObjectURL(f), thumb: null, duration: null};
    items.push(item); added++;
    if (isV) queueThumb(item);
  }
  $('#statusText').textContent = items.length ? 'Files loaded' : 'No folder opened';
  toast(added ? `Added ${added} item${added > 1 ? 's' : ''}` : 'No photos or videos found');
  render();
}
$('#pickFolder').onchange = e => { addFiles(e.target.files); e.target.value = ''; };
$('#pickFiles').onchange  = e => { addFiles(e.target.files); e.target.value = ''; };

/* ---------- video thumbnails (one at a time) ---------- */
let thumbChain = Promise.resolve();
function queueThumb(item){
  thumbChain = thumbChain.then(() => makeThumb(item)).then(render);
}
function makeThumb(item){
  return new Promise(resolve => {
    const v = document.createElement('video');
    v.muted = true; v.playsInline = true; v.preload = 'auto'; v.src = item.url;
    let done = false;
    const finish = () => { if (done) return; done = true; v.removeAttribute('src'); v.load(); resolve(); };
    const timer = setTimeout(finish, 6000);
    v.onloadedmetadata = () => {
      item.duration = v.duration;
      v.currentTime = Math.min(1, Math.max(0.1, (v.duration || 1) / 2));
    };
    v.onseeked = () => {
      try {
        const w = 360, h = Math.round(w * ((v.videoHeight || 9) / (v.videoWidth || 16)));
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(v, 0, 0, w, h);
        item.thumb = c.toDataURL('image/jpeg', 0.78);
      } catch (e) {}
      clearTimeout(timer); finish();
    };
    v.onerror = () => { clearTimeout(timer); finish(); };
  });
}

/* ---------- library ---------- */
function render(){
  const counts = {all: items.length, image: 0, video: 0};
  items.forEach(i => counts[i.type]++);
  $('#cAll').textContent = counts.all; $('#cImg').textContent = counts.image; $('#cVid').textContent = counts.video;
  $('#countText').textContent = `${items.length} item${items.length === 1 ? '' : 's'}`;

  visibleIdx = items.map((_, i) => i).filter(i => filter === 'all' || items[i].type === filter);
  const grid = $('#grid');
  if (!visibleIdx.length){
    grid.innerHTML = `<div class="empty"><b>🔮</b>Open a folder to see your photos and videos.<br>Files stay on your device and are read only when you open them.</div>`;
    return;
  }
  grid.innerHTML = visibleIdx.map(i => {
    const it = items[i];
    const thumb = it.type === 'image'
      ? `<img src="${it.url}" loading="lazy" alt="">`
      : (it.thumb ? `<img src="${it.thumb}" alt="">` : `<span class="ph">🎬</span>`);
    const dur = it.type === 'video' && it.duration ? `<span class="dur">${fmt(it.duration)}</span>` : '';
    return `<button class="card" data-i="${i}">
      <div class="thumb">${thumb}<span class="badge">${it.type === 'video' ? 'VIDEO' : 'PHOTO'}</span>${dur}
        <div class="play-ov"><span>▶</span></div></div>
      <div class="meta"><span>${esc(it.name)}</span><small>${it.type === 'video' ? 'Video' : 'Image'}</small></div>
    </button>`;
  }).join('');
}
$('#grid').addEventListener('click', e => {
  const card = e.target.closest('.card');
  if (card) openItem(+card.dataset.i);
});
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  filter = b.dataset.f;
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  render();
});

/* ---------- player ---------- */
function openItem(i, autoplay = false){
  current = i;
  const it = items[i];
  rotation = 0; applyTransform();
  $('#vname').textContent = it.name;
  if (it.type === 'video'){
    img.style.display = 'none'; video.style.display = 'block';
    video.poster = it.thumb || '';   // thumbnail shows when the video is selected
    video.autoplay = autoplay;
    video.src = it.url;
    video.load();
  } else {
    video.pause(); video.removeAttribute('src'); video.load();
    video.style.display = 'none'; img.style.display = 'block';
    img.src = it.url;
  }
  setPlayIcon(false);
  viewer.classList.add('open');
}
function step(dir){
  const pos = visibleIdx.indexOf(current);
  const next = visibleIdx[pos + dir];
  if (next !== undefined) openItem(next, true);
}
function closeViewer(){
  video.pause();
  viewer.classList.remove('open', 'expanded');
  if (document.fullscreenElement) document.exitFullscreen();
}
function applyTransform(){
  const sideways = rotation % 180 !== 0;
  const scale = sideways ? Math.min(stage.clientWidth / Math.max(stage.clientHeight, 1), stage.clientHeight / Math.max(stage.clientWidth, 1)) : 1;
  const t = `rotate(${rotation}deg) scale(${scale})`;
  video.style.transform = t; img.style.transform = t;
  const fill = fitMode === 'stretch' ? 'fill' : 'contain';
  video.style.objectFit = fill; img.style.objectFit = fill;
  $('#fit').textContent = fitMode === 'stretch' ? 'Stretch' : 'Fit 16:9';
}
function toggleFit(){ fitMode = fitMode === 'contain' ? 'stretch' : 'contain'; applyTransform(); }
function rotateBy(deg){ rotation = (rotation + deg) % 360; applyTransform(); }
function toggleFs(){
  if (document.fullscreenElement) document.exitFullscreen();
  else viewer.requestFullscreen?.().catch(() => toast('Fullscreen not available'));
}
function togglePlay(){ if (video.paused) video.play().catch(() => {}); else video.pause(); }
function toggleExpand(){ viewer.classList.toggle('expanded'); }

$('#close').onclick = closeViewer;
$('#play').onclick = togglePlay;
video.onclick = togglePlay;
video.onplay  = () => setPlayIcon(true);
video.onpause = () => setPlayIcon(false);
video.onended = () => {
  setPlayIcon(false);
  const pos = visibleIdx.indexOf(current);
  if (pos > -1 && pos < visibleIdx.length - 1) step(1);   // play the next item automatically
};
$('#back10').onclick = () => video.currentTime = Math.max(0, video.currentTime - 10);
$('#fwd10').onclick  = () => video.currentTime = Math.min(video.duration || 0, video.currentTime + 10);
$('#speed').onclick = () => {
  speedIdx = (speedIdx + 1) % SPEEDS.length;
  video.playbackRate = SPEEDS[speedIdx];
  $('#speed').textContent = SPEEDS[speedIdx] + '×';
};
$('#rotL').onclick = () => rotateBy(-90);
$('#rotR').onclick = () => rotateBy(90);
$('#rotate').onclick = () => rotateBy(90);
$('#fit').onclick = toggleFit;
$('#fsBtn').onclick = toggleFs;
$('#prev').onclick = () => step(-1);
$('#next').onclick = () => step(1);

/* Auto-hide controls in fullscreen while playing; any movement or tap brings them back */
let idleTimer = null;
function showControls(){
  viewer.classList.remove('idle');
  clearTimeout(idleTimer);
  if (!document.fullscreenElement) return;
  idleTimer = setTimeout(() => {
    const playing = img.style.display === 'block' || !video.paused;
    if (playing) viewer.classList.add('idle');
  }, 2500);
}
['mousemove','pointerdown','touchstart','keydown'].forEach(ev =>
  document.addEventListener(ev, showControls, {passive: true}));
document.addEventListener('fullscreenchange', () => { viewer.classList.remove('idle'); showControls(); });
video.addEventListener('pause', showControls);
video.addEventListener('play', showControls);
$('#vfs').onclick = toggleFs;
video.onloadedmetadata = () => {
  $('#dur').textContent = fmt(video.duration);
  const it = items[current];
  if (it && it.type === 'video') { it.duration = video.duration; render(); }
};
video.ontimeupdate = () => {
  $('#cur').textContent = fmt(video.currentTime);
  if (video.duration) $('#seek').value = (video.currentTime / video.duration) * 100;
};
$('#seek').oninput = e => { if (video.duration) video.currentTime = (e.target.value / 100) * video.duration; };

/* keyboard shortcuts (match the original hint line) */
document.addEventListener('keydown', e => {
  if (!viewer.classList.contains('open')) return;
  const k = e.key.toLowerCase();
  if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'ArrowRight') step(1);
  else if (e.key === 'ArrowLeft') step(-1);
  else if (k === 'm') video.muted = !video.muted;
  else if (k === 'e') toggleExpand();
  else if (k === 'f') toggleFs();
  else if (k === 'r') rotateBy(90);
  else if (k === 's') toggleFit();
  else if (e.key === 'Escape') closeViewer();
});

/* offline support for the installed app */
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

render();
</script>
</body>
</html>
